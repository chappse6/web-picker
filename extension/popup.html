<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        width: 260px; margin: 0; padding: 12px 14px 14px;
        font: 13px/1.45 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
        color: #0b0f12; background: #fff;
      }
      .row { display: flex; align-items: center; gap: 8px; }
      .brand {
        font: 650 14px/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -.02em; color: #0b1220;
      }
      .ver { margin-left: auto; font: 11px/1 ui-monospace, Menlo, monospace; color: #aab0b8; }
      .status { margin-top: 12px; display: flex; align-items: center; gap: 8px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #d0d5dd; }
      .dot.ok { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
      .dot.err { background: #f04438; box-shadow: 0 0 0 3px rgba(240,68,56,.16); }
      .label { font-weight: 600; font-size: 12.5px; color: #344054; }
      .qbadge {
        margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px;
        border-radius: 999px; background: #22c55e; color: #052e16;
        font: 700 11px/18px system-ui, sans-serif; text-align: center;
      }
      .qbadge[hidden] { display: none !important; }
      .session { margin-top: 8px; font-size: 11.5px; color: #98a2b3; }
    </style>
  </head>
  <body>
    <div class="row">
      <span class="brand">webpicker</span>
      <span class="ver" id="ver">v0.1.0</span>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span class="label" id="daemon">확인 중…</span>
      <span class="qbadge" id="pending" hidden></span>
    </div>
    <div class="session" id="session"></div>
    <script src="popup.js"></script>
  </body>
</html>
