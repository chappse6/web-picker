<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        width: 300px; margin: 0; padding: 0;
        font: 13px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
        color: #0b0f12; background: #fff;
      }
      .wp-hd { display: flex; align-items: center; gap: 9px; padding: 13px 15px 11px; }
      .wp-ttl { font-weight: 600; font-size: 13.5px; letter-spacing: -.01em; }
      .ver { margin-left: auto; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #aab0b8; }
      .wp-bd { padding: 4px 15px 16px; }
      .srow {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        font-size: 13px; padding: 9px 0; border-top: 1px solid #f2f3f5;
      }
      .srow:first-child { border-top: none; }
      .slbl { color: #8a919b; }
      .sval { display: flex; align-items: center; gap: 7px; font-weight: 500; color: #1d2939; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 500; }
      .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; background: #d0d5dd; }
      .btn {
        width: 100%; margin-top: 14px; border: 0; border-radius: 10px; padding: 11px 15px;
        font: 600 13px system-ui, sans-serif; background: #22c55e; color: #052e16; cursor: pointer;
      }
      .btn:hover { background: #1eb856; }
      .note { font-size: 11.5px; color: #98a2b3; line-height: 1.55; margin: 12px 2px 0; }
    </style>
  </head>
  <body>
    <div class="wp-hd">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round"><path d="M4 4l7 16 2-6 6-2z"/></svg>
      <span class="wp-ttl">웹픽커</span>
      <span class="ver" id="ver">v0.1.0</span>
    </div>
    <div class="wp-bd">
      <div class="srow"><span class="slbl">데몬 연결</span><span class="sval" id="daemon"><span class="dot"></span><span class="mono">확인 중…</span></span></div>
      <div class="srow"><span class="slbl">점유 세션</span><span class="sval" id="session">—</span></div>
      <div class="srow"><span class="slbl">대기 요청</span><span class="sval" id="pending">—</span></div>
      <button class="btn" id="refresh">연결 새로고침</button>
      <p class="note">localhost 전용 · 데몬은 127.0.0.1에만 바인딩</p>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
